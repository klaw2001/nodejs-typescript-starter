# Local development / quick deployment.
#   docker compose up -d db          # PostgreSQL only (run the API with `npm run dev`)
#   docker compose up -d --build     # PostgreSQL + API
#   docker compose run --rm api npx prisma migrate deploy   # apply migrations
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
      PORT: 8000
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
      - logs:/app/logs

volumes:
  pgdata:
  uploads:
  logs:
